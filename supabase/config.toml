project_id = "NHHOLDINGS"
[auth]
enabled = true
site_url = "https://nhholdings.xyz/login"
additional_redirect_urls = ["https://nhholdings.xyz/login", "https://nhholdings.xyz/nurimarket/login", "https://nhholdings.vercel.app/login", "http://127.0.0.1:3120/login", "http://127.0.0.1:3120/nurimarket/login"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_expiry = 3600
otp_length = 8
max_frequency = "1m"
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
